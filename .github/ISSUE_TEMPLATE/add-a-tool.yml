name: Add a tool
description: Suggest an AI tool to add to the directory
title: "Add: "
labels: ["new-tool"]
body:
  - type: input
    id: name
    attributes:
      label: Tool name
      placeholder: "Surfer SEO"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official URL
      placeholder: "https://surferseo.com"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which existing category does this belong in? If none fit, open a "Suggest a category" issue instead.
      options:
        - AI Tools for SEO Content Briefs & Optimization
        - AI Tools for Social Media Scheduling
        - AI Tools for Ad Copywriting & Creative Generation
        - AI Tools for Email Marketing Automation
        - AI Tools for Influencer Marketing & Creator Discovery
        - AI Tools for Short-Form Marketing Video
        - AI Tools for Landing Page Optimization & CRO
        - AI Tools for Marketing Analytics & Attribution
        - Other / not sure
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: One-line description
      description: Factual, ≤160 characters, no superlatives.
      placeholder: "Content Editor scores drafts against live SERP data with on-page optimization guidelines."
    validations:
      required: true
  - type: dropdown
    id: pricing
    attributes:
      label: Pricing tier
      options:
        - Free
        - Freemium
        - Paid
        - Paid (enterprise/custom pricing)
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure
      options:
        - label: I'm not affiliated with this tool, or I've said so above/below
